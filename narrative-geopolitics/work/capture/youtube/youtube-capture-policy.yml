    reason: core military feasibility lane with recurring Davis, Mearsheimer, Wilkerson, Hoh, Ritter
    expected_browser_rule: verify same-day long-form and segment uploads

  glenn-diesen:
    tier: A
    reason: core order-transition and Eurasia mechanism lane
    expected_browser_rule: verify same-day interviews and Russia-Iran-China titles

  judging-freedom:
