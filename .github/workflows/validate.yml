name: Validate repository

on:
  push:
  pull_request:

jobs:
  public-package:
    name: Public package (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python tools/validate_repo.py --scope public-package
        env:
          MIRA_CORE_SESSION_TEMP_ROOT: ${{ runner.temp }}

  corpus-integrity:
    name: Corpus integrity (private evidence may be unavailable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate corpus without hydrating private stores
        run: python tools/validate_repo.py --scope corpus
        env:
          MIRA_CORE_SESSION_TEMP_ROOT: ${{ runner.temp }}
