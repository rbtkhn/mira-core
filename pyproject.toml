[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-core"
version = "0.1.0"
description = "Mira's integrated, archive-first monorepo for governed memory, research, and judgment."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Robert Kuhne" }
]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "tzdata>=2026.3,<2027",
  "zstandard>=0.25,<0.26"
]

[project.optional-dependencies]
test = [
  "pytest>=8"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--capture=sys"]
markers = [
  "repository_integrity: live whole-repository validation already run by the canonical wrapper"
]
